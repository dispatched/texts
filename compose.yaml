services:
  sbv:
    # Use pre-built image from GitHub Container Registry
    # For local development, comment out 'image' and uncomment 'build: .' below
    image: ghcr.io/lowcarbdev/sbv:stable
    # build: .
    container_name: sbv
    ports:
      - "8081:8081"
    volumes:
      # Mount data directory for persistent database storage
      - ./data:/data
    environment:
      - PORT=8081
      - DB_PATH_PREFIX=/data
      - PUID=1000
      - PGID=1000
    restart: unless-stopped
    healthcheck:
      # Note: --spider makes wget send a HEAD request. /api/health is only
      # registered for GET, and Echo's router falls through to the
      # authenticated catch-all (401) for the unmatched HEAD method rather
      # than 404ing, so --spider always reports unhealthy. Use a real GET
      # (discarding the body) instead.
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
